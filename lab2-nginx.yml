---
- name: Lab 2 - Deploy nginx with a template and a handler
  hosts: web
  become: true
  vars:
    site_title: Ansible Training
    web_port: 8080
    web_root: /srv/www/lab
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Remove the default site shipped with the package
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Create the web root
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the index page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ web_root }}/index.html"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy the virtual host
      ansible.builtin.template:
        src: templates/lab.conf.j2
        dest: /etc/nginx/conf.d/lab.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Make sure nginx is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
